name: Temporary Binding target v2

on:
  push:
    branches:
      - architecture/stable-binding-target-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Apply Binding target v2 changes
        run: python _tmp_apply_binding_target_v2.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Format and verify Python suite
        run: |
          ruff format .
          ruff check . --fix
          ruff format --check .
          ruff check .
          pytest

      - name: Remove temporary helpers and commit verified tree
        run: |
          rm _tmp_apply_binding_target_v2.py
          rm .github/workflows/_tmp-binding-target-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: persist stable Binding target identity"
          git push origin HEAD:architecture/stable-binding-target-v2
