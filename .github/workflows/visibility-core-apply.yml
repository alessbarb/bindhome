name: Apply Managed Visibility Core

on:
  push:
    branches:
      - feat/managed-hardware-visibility

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/managed-hardware-visibility
          fetch-depth: 0
      - name: Apply patch script
        run: python .github/scripts/apply_visibility_core.py
      - name: Normalize generated files
        run: python .github/scripts/fix_visibility_patch.py
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: persist reversible hardware visibility ownership"
          git push origin HEAD:feat/managed-hardware-visibility
