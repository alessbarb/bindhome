name: Apply Managed Visibility Core

on:
  push:
    branches:
      - feat/managed-hardware-visibility

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/managed-hardware-visibility
          fetch-depth: 0

      - name: Apply core model and tests
        run: |
