name: Temporary resolve PR 76

on:
  push:
    branches:
      - perf/passive-panel-rendering

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/passive-panel-rendering
          fetch-depth: 0

      - name: Merge latest main and resolve overlapping panel changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-commit origin/main || true

          conflicts=$(git diff --name-only --diff-filter=U)
          echo "Conflicts:"
          echo "$conflicts"

          # Prefer the newly modularized main versions for overlapping files,
          # then reapply the passive-update change semantically below.
          for path in $conflicts; do
            git checkout --theirs -- "$path"
            git add "$path"
          done

          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/bindhome-panel.js")
          source = path.read_text()

          anchor = "    this._onboardingPreferenceIdentity = null;\n"
          insert = """    this._onboardingPreferenceIdentity = null;
            this._hassByView = { home: null, add: null, advanced: null };
            this._refreshBindingDataHandler = () => this._refreshBindingData();
            this._refreshTopologyDataHandler = () => this._refreshTopologyData();
            this._refreshAssetsHandler = () => this._refreshAssets();
            this._addCreatedHandler = async (created) => {
              const assets = await this._refreshAssets();
              const asset = created ?? assets?.at(-1);
              if (asset) this._openAsset(asset.id);
            };
          """
          if "this._hassByView" not in source:
              if anchor not in source:
                  raise SystemExit("constructor anchor not found")
              source = source.replace(anchor, insert, 1)

          render_anchor = "  _renderViews() {\n"
          helper = """  _hassFor(view) {
            if (this._view === view || this._hassByView[view] == null) {
              this._hassByView[view] = this.hass;
            }
            return this._hassByView[view];
          }
          _renderViews() {
          """
          if "  _hassFor(view) {" not in source:
              if render_anchor not in source:
                  raise SystemExit("render anchor not found")
              source = source.replace(render_anchor, helper, 1)

          replacements = {
              "      hass: this.hass,\n": "",
              "      refreshBindingData: () => this._refreshBindingData(),\n": "      refreshBindingData: this._refreshBindingDataHandler,\n",
              "      refreshTopologyData: () => this._refreshTopologyData(),\n": "      refreshTopologyData: this._refreshTopologyDataHandler,\n",
              "          .hass=${common.hass}\n": "          .hass=${this._hassFor(\"home\")}\n",
              "          .refreshAssets=${() => this._refreshAssets()}\n": "          .refreshAssets=${this._refreshAssetsHandler}\n",
              "          .hass=${this.hass}\n": "          .hass=${this._hassFor(\"add\")}\n",
              "          .onCreated=${async (created) => {\n            const assets = await this._refreshAssets();\n            const asset = created ?? assets?.at(-1);\n            if (asset) this._openAsset(asset.id);\n          }}\n": "          .onCreated=${this._addCreatedHandler}\n",
          }
          for old, new in replacements.items():
              if old in source:
                  source = source.replace(old, new, 1)

          # After the Home replacement, the remaining common.hass belongs to Advanced.
          source = source.replace(
              "          .hass=${common.hass}\n",
              "          .hass=${this._hassFor(\"advanced\")}\n",
              1,
          )

          path.write_text(source)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          entry = (
              "- The BindHome panel now keeps Home Assistant's high-frequency `hass` updates local to the active top-level view. "
              "Inactive Home, Add and Advanced views retain their mounted UI state without receiving routine state-machine churn, "
              "reducing unnecessary frontend work while preserving drafts and navigation state.\n"
          )
          if entry not in text:
              marker = "### Reliability\n\n"
              if marker not in text:
                  raise SystemExit("CHANGELOG Reliability anchor not found")
              text = text.replace(marker, marker + entry, 1)
              changelog.write_text(text)
          PY

          git add frontend/src/bindhome-panel.js CHANGELOG.md frontend/test/passive-panel.test.js

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate resolved tree
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Finish merge and push
        run: |
          git add custom_components/bindhome/panel/static/bindhome-panel.js
          git rm .github/workflows/_tmp-resolve-pr76.yml
          git commit -m "Merge main into perf/passive-panel-rendering"
          git push origin HEAD:perf/passive-panel-rendering
