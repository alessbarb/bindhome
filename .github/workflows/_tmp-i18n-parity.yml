name: Temporary i18n parity completion

on:
  push:
    branches:
      - i18n/ha-translation-parity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: i18n/ha-translation-parity
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply translation parity changes
        run: python .github/scripts/_tmp_complete_i18n.py
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Verify Python and translation contracts
        run: |
          ruff check --fix tests/test_translation_parity.py
          ruff format tests/test_translation_parity.py
          ruff check custom_components/bindhome tests
          ruff format --check custom_components/bindhome tests
          pytest
      - name: Verify frontend localization
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          git diff --exit-code -- ../custom_components/bindhome/panel/static/bindhome-panel.js
      - name: Commit verified i18n parity
        run: |
          rm -f .github/workflows/_tmp-i18n-parity.yml .github/scripts/_tmp_complete_i18n.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'i18n: enforce Home Assistant translation parity'
          git push origin HEAD:i18n/ha-translation-parity
