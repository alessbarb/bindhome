name: Home Assistant Compatibility

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-home-assistant:
    name: HA ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.4.0"
            harness: "0.13.321"
          - homeassistant: "2026.5.0"
            harness: "0.13.329"
          - homeassistant: "2026.6.0"
            harness: "0.13.336"
          - homeassistant: "2026.7.0"
            harness: "0.13.344"
          - homeassistant: "2026.8.0"
            harness: "0.13.354"
          - homeassistant: "2026.9.0"
            harness: "0.13.363"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install BindHome and Home Assistant test harness
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install "pytest-homeassistant-custom-component==${{ matrix.harness }}"

      - name: Verify Home Assistant version
        run: |
          python - <<'PY'
          import homeassistant.const
          expected = "${{ matrix.homeassistant }}"
          actual = homeassistant.const.__version__
          if actual != expected:
              raise SystemExit(f"Expected Home Assistant {expected}, got {actual}")
          print(f"Testing BindHome against Home Assistant {actual}")
          PY

      - name: Run full Python suite
        run: pytest
