name: Temporary Finish Registry Live Updates

on:
  push:
    branches:
      - reliability/live-registry-concurrency-v2

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reliability/live-registry-concurrency-v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wire panel live Registry behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          panel_path = Path("frontend/src/bindhome-panel.js")
          text = panel_path.read_text()

          old = 'import { createBindHomeApi } from "./api/bindhome-api.js";'
          new = '''import {
            createBindHomeApi,
            subscribeBindHomeConflicts,
          } from "./api/bindhome-api.js";'''
          if old not in text:
              raise SystemExit("panel API import marker missing")
          text = text.replace(old, new, 1)

          old = '    _onboardingVisible: { state: true },\n'
          new = old + '    _registryConflict: { state: true },\n'
          if old not in text:
              raise SystemExit("panel property marker missing")
          text = text.replace(old, new, 1)

          old = '''    this._onboardingPreferenceIdentity = null;
            this._hassByView = { home: null, add: null, advanced: null };'''
          new = '''    this._onboardingPreferenceIdentity = null;
            this._registryConflict = false;
            this._registryUnsubscribe = null;
            this._registrySubscriptionConnection = null;
            this._registrySubscriptionGeneration = 0;
            this._registryRefreshPromise = null;
            this._conflictUnsubscribe = null;
            this._reloadAfterConflictHandler = () => this._reloadAfterConflict();
            this._hassByView = { home: null, add: null, advanced: null };'''
          if old not in text:
              raise SystemExit("panel constructor marker missing")
          text = text.replace(old, new, 1)

          marker = '  static styles = css`\n'
          lifecycle = '''  connectedCallback() {
            super.connectedCallback();
            if (this.hass && this._initialized) this._ensureRegistrySubscription();
          }
          disconnectedCallback() {
            this._dropRegistrySubscription();
            this._dropConflictSubscription();
            super.disconnectedCallback();
          }
          _dropRegistrySubscription() {
            this._registrySubscriptionGeneration += 1;
            const unsubscribe = this._registryUnsubscribe;
            this._registryUnsubscribe = null;
            this._registrySubscriptionConnection = null;
            if (typeof unsubscribe === "function") unsubscribe();
          }
          _dropConflictSubscription() {
            const unsubscribe = this._conflictUnsubscribe;
            this._conflictUnsubscribe = null;
            if (typeof unsubscribe === "function") unsubscribe();
          }
          async _ensureRegistrySubscription() {
            const connection = this.hass?.connection;
            if (!connection || connection === this._registrySubscriptionConnection) return;

            this._dropRegistrySubscription();
            this._dropConflictSubscription();
            const generation = ++this._registrySubscriptionGeneration;
            this._registrySubscriptionConnection = connection;
            this._conflictUnsubscribe = subscribeBindHomeConflicts(this.hass, () => {
              this._registryConflict = true;
            });

            try {
              const unsubscribe = await createBindHomeApi(
                this.hass,
              ).subscribeRegistryChanges((event) => this._registryChanged(event));
              if (
                generation !== this._registrySubscriptionGeneration ||
                connection !== this._registrySubscriptionConnection
              ) {
                unsubscribe();
                return;
              }
              this._registryUnsubscribe = unsubscribe;
            } catch (error) {
              if (
                generation === this._registrySubscriptionGeneration &&
                connection === this._registrySubscriptionConnection
              ) {
                this._registrySubscriptionConnection = null;
                this._dropConflictSubscription();
                this._refreshError =
                  error?.message || this._t("shell.refresh_error");
              }
            }
          }
          _registryChanged(event) {
            if (!Number.isInteger(event?.revision) || event.revision < 0) return;
            const current = this._registry?.revision;
            if (Number.isInteger(current) && event.revision <= current) return;
            this._refreshRegistryFromEvent();
          }
          async _refreshRegistryFromEvent() {
            if (!this.hass) return;
            if (this._registryRefreshPromise) return this._registryRefreshPromise;

            const generation = ++this._dataGeneration;
            const api = createBindHomeApi(this.hass);
            this._registryRefreshPromise = Promise.all([
              api.getRegistry(),
              api.listBindingStatuses(),
            ]);
            try {
              const [registry, bindingStatuses] = await this._registryRefreshPromise;
              if (generation !== this._dataGeneration) return;
              this._registry = registry;
              this._assets = registry.assets ?? this._assets;
              this._bindingStatuses = bindingStatuses;
              this._refreshError = null;
              this._syncOnboardingVisibility();
            } catch (error) {
              if (generation === this._dataGeneration) {
                this._refreshError =
                  error?.message || this._t("shell.refresh_error");
              }
            } finally {
              this._registryRefreshPromise = null;
            }
          }
          async _reloadAfterConflict() {
            await this._load(false);
          }
'''
          if marker not in text:
              raise SystemExit("panel styles marker missing")
          text = text.replace(marker, lifecycle + marker, 1)

          old = '''    if (
              changed.has("hass") &&
              this.hass &&
              !this._initialized &&
              !this._loadPromise
            )
              this._load(true);
            else if (
              changed.has("hass") &&
              this.hass &&
              this._initialized &&
              (this.hass.language || "en") !== this._translationLanguage
            )
              this._loadTranslations(this.hass.language || "en");'''
          new = '''    if (
              changed.has("hass") &&
              this.hass &&
              !this._initialized &&
              !this._loadPromise
            )
              this._load(true);
            else if (
              changed.has("hass") &&
              this.hass &&
              this._initialized &&
              (this.hass.language || "en") !== this._translationLanguage
            )
              this._loadTranslations(this.hass.language || "en");
            if (changed.has("hass") && this.hass && this._initialized) {
              this._ensureRegistrySubscription();
            }'''
          if old not in text:
              raise SystemExit("panel updated marker missing")
          text = text.replace(old, new, 1)

          old = '''      this._deviceRegistry = deviceRegistry;
              this._t = translator;
              this._translationLanguage = language;'''
          new = '''      this._deviceRegistry = deviceRegistry;
              this._t = translator;
              this._translationLanguage = language;
              this._registryConflict = false;
              this._ensureRegistrySubscription();'''
          if old not in text:
              raise SystemExit("panel load-success marker missing")
          text = text.replace(old, new, 1)

          old = '''      ${this._refreshError
                ? html`<div class="refresh-error" role="alert">${this._t("shell.refresh_error")} ${this._refreshError}</div>`
                : null}
              <main>'''
          new = '''      ${this._registryConflict
                ? html`<div class="refresh-error registry-conflict" role="alert">
                    <span>${this._t("shell.registry_conflict")}</span>
                    <button class="retry" @click=${this._reloadAfterConflictHandler}>
                      ${this._t("shell.registry_conflict_reload")}
                    </button>
                  </div>`
                : null}
              ${this._refreshError
                ? html`<div class="refresh-error" role="alert">${this._t("shell.refresh_error")} ${this._refreshError}</div>`
                : null}
              <main>'''
          if old not in text:
              raise SystemExit("panel refresh-error marker missing")
          text = text.replace(old, new, 1)
          panel_path.write_text(text)

          for language, conflict, reload_label in (
              (
                  "en",
                  "BindHome changed in another session. Reload the latest data before trying again.",
                  "Reload latest",
              ),
              (
                  "es",
                  "BindHome ha cambiado en otra sesión. Recarga los datos más recientes antes de volver a intentarlo.",
                  "Recargar datos",
              ),
          ):
              path = Path(f"custom_components/bindhome/translations/{language}.json")
              source = path.read_text()
              marker = (
                  '    "panel_shell_refresh_error": '
                  + ('"Refresh failed. Your current work was preserved.",' if language == "en" else '"Falló la actualización. Tu trabajo actual se ha conservado.",')
              )
              replacement = marker + (
                  f'\n    "panel_shell_registry_conflict": "{conflict}",'
                  f'\n    "panel_shell_registry_conflict_reload": "{reload_label}",'
              )[0] + (
                  f'\n    "panel_shell_registry_conflict_reload": "{reload_label}",'
              )
              if marker not in source:
                  raise SystemExit(f"translation marker missing: {language}")
              source = source.replace(marker, replacement, 1)
              path.write_text(source)

          test_path = Path("tests/test_websocket.py")
          source = test_path.read_text()
          old = '''    def __init__(self) -> None:
                  self.registry = Mock()'''
          new = '''    def __init__(self) -> None:
                  self.revision = 0
                  self.registry = Mock()'''
          if old not in source:
              raise SystemExit("websocket FakeManager marker missing")
          source = source.replace(old, new, 1)
          old = '''    assert connection.results == [("1", manager.registry.to_dict.return_value)]'''
          new = '''    assert connection.results == [
                  ("1", {**manager.registry.to_dict.return_value, "revision": 0})
              ]'''
          if old not in source:
              raise SystemExit("registry get assertion marker missing")
          source = source.replace(old, new, 1)
          test_path.write_text(source)
          PY

      - name: Add focused panel live-update tests
        run: |
          cat > frontend/test/registry-live-panel.test.js <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { Window } from "happy-dom";

          const window = new Window({ url: "http://localhost/bindhome" });
          Object.assign(globalThis, {
            window,
            document: window.document,
            customElements: window.customElements,
            HTMLElement: window.HTMLElement,
            ShadowRoot: window.ShadowRoot,
            Document: window.Document,
            CSSStyleSheet: window.CSSStyleSheet,
            Event: window.Event,
            CustomEvent: window.CustomEvent,
            CSS: window.CSS,
          });

          const { createBindHomeApi } = await import("../src/api/bindhome-api.js");
          await import("../src/bindhome-panel.js");

          function harness() {
            let listener = null;
            let unsubscribeCount = 0;
            let revision = 1;
            let assets = [{ id: "asset-1", name: "Before", asset_type: "socket", capabilities: [] }];
            let conflictNext = false;
            const connection = {
              async subscribeMessage(callback, message) {
                assert.deepEqual(message, { type: "bindhome/registry/subscribe" });
                listener = callback;
                return () => { unsubscribeCount += 1; listener = null; };
              },
            };
            const hass = {
              connection,
              language: "en",
              user: { id: "user-1" },
              async callWS(message) {
                if (message.type === "bindhome/registry/get") {
                  return {
                    schema_version: 2,
                    assets,
                    relations: [],
                    bindings: [],
                    representations: [],
                    revision,
                  };
                }
                if (message.type === "bindhome/bindings/status") {
                  return { records: [], summary: {} };
                }
                if (conflictNext) {
                  conflictNext = false;
                  throw { code: "conflict", message: "stale" };
                }
                return { revision: ++revision };
              },
            };
            return {
              hass,
              connection,
              emit(event) { listener?.(event); },
              setAssets(next) { assets = next; revision += 1; },
              conflict() { conflictNext = true; },
              unsubscribeCount: () => unsubscribeCount,
            };
          }

          async function settle(element) {
            await element.updateComplete;
            await window.happyDOM.waitUntilComplete();
            await element.updateComplete;
          }

          test("a Registry event refreshes a second panel without hass churn or polling", async () => {
            const h = harness();
            const panel = document.createElement("bindhome-panel");
            panel.hass = h.hass;
            panel._initialized = true;
            panel._registry = { revision: 1, assets: [] };
            await panel._ensureRegistrySubscription();

            h.setAssets([{ id: "asset-1", name: "After", asset_type: "socket", capabilities: [] }]);
            h.emit({ revision: 2 });
            await panel._registryRefreshPromise;

            assert.equal(panel._assets[0].name, "After");
            assert.equal(panel._registry.revision, 2);
          });

          test("a stale mutation surfaces a reload action and subscription cleanup is explicit", async () => {
            const h = harness();
            const panel = document.createElement("bindhome-panel");
            panel.hass = h.hass;
            panel._initialized = true;
            panel._t = (key) => key;
            await createBindHomeApi(h.hass).getRegistry();
            await panel._ensureRegistrySubscription();

            h.conflict();
            await assert.rejects(
              createBindHomeApi(h.hass).deleteBinding("binding-1"),
              (error) => error.code === "conflict",
            );
            await settle(panel);

            assert.equal(panel._registryConflict, true);
            assert.ok(panel.shadowRoot.querySelector(".registry-conflict .retry"));

            panel._dropRegistrySubscription();
            panel._dropConflictSubscription();
            assert.equal(h.unsubscribeCount(), 1);
          });
          EOF

      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify Python
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests
          pytest -q

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Commit verified integration and bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/bindhome-panel.js \
            frontend/test/registry-live-panel.test.js \
            custom_components/bindhome/translations/en.json \
            custom_components/bindhome/translations/es.json \
            tests/test_websocket.py \
            custom_components/bindhome/panel/static/bindhome-panel.js
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: synchronize panel with live Registry revisions"
          git push origin HEAD:reliability/live-registry-concurrency-v2
