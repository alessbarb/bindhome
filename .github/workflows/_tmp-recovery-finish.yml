name: Temporary recovery completion

on:
  push:
    branches:
      - reliability/registry-recovery

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reliability/registry-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Add recovery translations, tests and changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          translations = {
              'en.json': (
                  'BindHome needs Registry recovery',
                  'BindHome could not safely load its Registry ({reason}): {message}. Normal BindHome operation remains disabled to protect stored infrastructure data. Restore a valid BindHome backup through the administrator recovery API, then reload the integration.',
              ),
              'es.json': (
                  'BindHome necesita recuperar el Registry',
                  'BindHome no ha podido cargar el Registry de forma segura ({reason}): {message}. El funcionamiento normal permanece desactivado para proteger los datos de infraestructura almacenados. Restaura una copia de seguridad válida de BindHome mediante la API de recuperación para administradores y vuelve a cargar la integración.',
              ),
          }
          for filename, (title, description) in translations.items():
              path = Path('custom_components/bindhome/translations') / filename
              text = path.read_text()
              if '"registry_recovery"' not in text:
                  anchor = '  "system_health":'
                  pos = text.index(anchor)
                  block = (
                      '  "issues": {\n'
                      '    "registry_recovery": {\n'
                      f'      "title": "{title}",\n'
                      f'      "description": "{description}"\n'
                      '    }\n'
                      '  },\n'
                  )
                  text = text[:pos] + block + text[pos:]
                  path.write_text(text)

          Path('tests/test_recovery.py').write_text('''"""Tests for fail-closed BindHome Registry recovery state."""\n\nfrom homeassistant.helpers import issue_registry as ir\n\nfrom custom_components.bindhome.const import DOMAIN\nfrom custom_components.bindhome.recovery import (\n    async_clear_recovery_state,\n    async_get_recovery_state,\n    async_set_recovery_state,\n)\nfrom custom_components.bindhome.store import (\n    BindHomeRegistryVersionError,\n    BindHomeStoreCorruptionError,\n    BindHomeStoreLoadError,\n    BindHomeStoreVersionError,\n)\n\n\ndef test_recovery_state_creates_and_clears_critical_repair(hass) -> None:\n    entry_id = "entry-1"\n    state = async_set_recovery_state(\n        hass, entry_id, BindHomeStoreCorruptionError("registry corrupt")\n    )\n\n    assert state.reason == "corrupt_storage"\n    assert async_get_recovery_state(hass, entry_id) is state\n    issue = ir.async_get(hass).async_get_issue(DOMAIN, f"registry_recovery_{entry_id}")\n    assert issue is not None\n    assert issue.severity is ir.IssueSeverity.CRITICAL\n    assert issue.is_persistent is True\n    assert issue.translation_key == "registry_recovery"\n\n    async_clear_recovery_state(hass, entry_id)\n\n    assert async_get_recovery_state(hass, entry_id) is None\n    assert ir.async_get(hass).async_get_issue(\n        DOMAIN, f"registry_recovery_{entry_id}"\n    ) is None\n\n\ndef test_recovery_reason_classification(hass) -> None:\n    cases = [\n        (BindHomeRegistryVersionError("future"), "future_registry_schema"),\n        (BindHomeStoreVersionError("envelope"), "storage_envelope_version"),\n        (BindHomeStoreLoadError("invalid"), "invalid_registry"),\n    ]\n\n    for index, (error, expected) in enumerate(cases):\n        state = async_set_recovery_state(hass, f"entry-{index}", error)\n        assert state.reason == expected\n''')

          backup_tests = Path('tests/test_backup_websocket.py')
          text = backup_tests.read_text()
          marker = 'async def test_recovery_restore_works_without_loaded_manager'
          if marker not in text:
              text += '''\n\n@pytest.mark.asyncio\nasync def test_recovery_restore_works_without_loaded_manager(monkeypatch) -> None:\n    entry = SimpleNamespace(\n        entry_id="entry-recovery",\n        state=backup_websocket.config_entries.ConfigEntryState.SETUP_ERROR,\n    )\n    reload_entry = AsyncMock(return_value=True)\n    hass = SimpleNamespace(\n        config_entries=SimpleNamespace(\n            async_entries=lambda domain: [entry],\n            async_reload=reload_entry,\n        )\n    )\n    recovery = SimpleNamespace(\n        to_dict=lambda: {\n            "entry_id": entry.entry_id,\n            "reason": "corrupt_storage",\n            "message": "corrupt",\n        }\n    )\n    monkeypatch.setattr(\n        backup_websocket, "async_get_recovery_state", lambda hass, entry_id: recovery\n    )\n    save = AsyncMock()\n    monkeypatch.setattr(\n        backup_websocket, "BindHomeStore", lambda hass: SimpleNamespace(async_save=save)\n    )\n    restored = BindHomeRegistry()\n    restored.add_asset(\n        Asset.create(name="Recovered socket", asset_type="socket", code="REC-01")\n    )\n    connection = FakeConnection()\n\n    await call(\n        backup_websocket.ws_backup_restore,\n        hass,\n        connection,\n        {"id": "recovery", "backup": export_registry_backup(restored)},\n    )\n\n    save.assert_awaited_once()\n    saved_registry = save.await_args.args[0]\n    assert saved_registry.to_dict() == restored.to_dict()\n    reload_entry.assert_awaited_once_with(entry.entry_id)\n    assert connection.errors == []\n    assert connection.results == [\n        (\n            "recovery",\n            {\n                "restored": True,\n                "reloaded": True,\n                "registry": restored.to_dict(),\n            },\n        )\n    ]\n\n\n@pytest.mark.asyncio\nasync def test_invalid_recovery_backup_never_writes_storage(monkeypatch) -> None:\n    entry = SimpleNamespace(\n        entry_id="entry-recovery",\n        state=backup_websocket.config_entries.ConfigEntryState.SETUP_ERROR,\n    )\n    hass = SimpleNamespace(\n        config_entries=SimpleNamespace(\n            async_entries=lambda domain: [entry],\n            async_reload=AsyncMock(return_value=True),\n        )\n    )\n    monkeypatch.setattr(\n        backup_websocket,\n        "async_get_recovery_state",\n        lambda hass, entry_id: SimpleNamespace(),\n    )\n    save = AsyncMock()\n    monkeypatch.setattr(\n        backup_websocket, "BindHomeStore", lambda hass: SimpleNamespace(async_save=save)\n    )\n    connection = FakeConnection()\n\n    await call(\n        backup_websocket.ws_backup_restore,\n        hass,\n        connection,\n        {"id": "invalid-recovery", "backup": {}},\n    )\n\n    save.assert_not_awaited()\n    assert connection.results == []\n    assert connection.errors\n    assert connection.errors[0][1] == ERR_INVALID_FORMAT\n'''
              backup_tests.write_text(text)

          Path('tests/test_recovery_setup.py').write_text('''"""Integration setup tests for Registry recovery mode."""\n\nfrom unittest.mock import AsyncMock\n\nimport pytest\nfrom homeassistant.exceptions import ConfigEntryError\nfrom homeassistant.helpers import issue_registry as ir\nfrom pytest_homeassistant_custom_component.common import MockConfigEntry\n\nfrom custom_components.bindhome import async_setup_entry\nfrom custom_components.bindhome.const import DOMAIN\nfrom custom_components.bindhome.recovery import async_get_recovery_state\nfrom custom_components.bindhome.store import BindHomeStoreCorruptionError\n\n\n@pytest.mark.asyncio\nasync def test_setup_failure_records_recovery_state_and_repair(hass, monkeypatch) -> None:\n    load = AsyncMock(side_effect=BindHomeStoreCorruptionError("registry corrupt"))\n    register_panel = AsyncMock()\n    monkeypatch.setattr("custom_components.bindhome.BindHomeManager.async_load", load)\n    monkeypatch.setattr("custom_components.bindhome.async_register_panel", register_panel)\n    entry = MockConfigEntry(domain=DOMAIN, data={})\n    entry.add_to_hass(hass)\n\n    with pytest.raises(ConfigEntryError, match="registry corrupt"):\n        await async_setup_entry(hass, entry)\n\n    state = async_get_recovery_state(hass, entry.entry_id)\n    assert state is not None\n    assert state.reason == "corrupt_storage"\n    assert ir.async_get(hass).async_get_issue(\n        DOMAIN, f"registry_recovery_{entry.entry_id}"\n    ) is not None\n    register_panel.assert_not_awaited()\n''')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          entry = '- Registry load failures now enter an explicit fail-closed recovery state with a critical Home Assistant Repair. Administrators can validate and restore a BindHome backup directly to storage even when the normal manager cannot load; successful restore reloads the config entry instead of requiring manual `.storage` edits. ([#65](https://github.com/alessbarb/bindhome/pull/65))\n'
          if entry not in text:
              anchor = '### Reliability\n\n'
              text = text.replace(anchor, anchor + entry, 1)
              changelog.write_text(text)
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Format and verify
        run: |
          ruff format custom_components/bindhome tests
          ruff check custom_components/bindhome tests
          ruff format --check custom_components/bindhome tests
          pytest
      - name: Remove temporary workflow and commit verified recovery
        run: |
          rm .github/workflows/_tmp-recovery-finish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components tests CHANGELOG.md .github/workflows/_tmp-recovery-finish.yml
          git diff --cached --check
          git commit -m 'test: complete fail-closed Registry recovery'
          git push origin HEAD:reliability/registry-recovery
