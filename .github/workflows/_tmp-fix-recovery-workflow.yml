name: Temporary recovery workflow fix

on:
  push:
    branches:
      - reliability/registry-recovery

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reliability/registry-recovery
          fetch-depth: 0
      - name: Fix translation insertion anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/_tmp-recovery-finish.yml')
          text = path.read_text().replace(
              "anchor = '  \"system_health\":'",
              "anchor = '  \"common\": {'",
          )
          path.write_text(text)
          PY
          rm .github/workflows/_tmp-fix-recovery-workflow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'ci: fix recovery completion workflow'
          git push origin HEAD:reliability/registry-recovery
