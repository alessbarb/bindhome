name: Temporary Verify Registry 1.3

on:
  push:
    branches:
      - reliability/live-registry-concurrency-v2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reliability/live-registry-concurrency-v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply exact panel wiring
        run: python .github/_tmp_finish_registry.py
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Normalize generated Python formatting
        run: ruff format custom_components/bindhome/websocket.py custom_components/bindhome/deletion_websocket.py
      - name: Verify Python
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests
          pytest -q
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit verified result and remove temporary tooling
        run: |
          rm .github/_tmp_finish_registry.py .github/workflows/_tmp-finish-registry-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: synchronize panel with live Registry revisions"
          git push origin HEAD:reliability/live-registry-concurrency-v2
