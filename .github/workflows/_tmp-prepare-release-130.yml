name: Temporary Prepare BindHome 1.3.0

on:
  push:
    branches:
      - release/1.3.0

permissions:
  contents: write

jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/1.3.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare release metadata and documentation
        run: python .github/_tmp_prepare_release_130.py
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Verify Python
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests
          pytest -q
      - name: Verify frontend and committed runtime artifact
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Remove temporary release tooling
        run: rm .github/_tmp_prepare_release_130.py .github/workflows/_tmp-prepare-release-130.yml
      - name: Verify release tree has no temporary tooling
        run: |
          test ! -e .github/_tmp_prepare_release_130.py
          test ! -e .github/workflows/_tmp-prepare-release-130.yml
          git status --short
      - name: Commit verified 1.3.0 release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: finalize BindHome 1.3.0"
          git push origin HEAD:release/1.3.0
