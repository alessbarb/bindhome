name: Temporary format passive panel patch

on:
  push:
    branches:
      - perf/passive-panel-rendering

permissions:
  contents: write

jobs:
  format-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/passive-panel-rendering
          fetch-depth: 0

      - name: Fix source indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/bindhome-panel.js")
          source = path.read_text()

          source = source.replace(
              '''    this._onboardingPreferenceIdentity = null;\n  this._hassByView = { home: null, add: null, advanced: null };\n  this._refreshBindingDataHandler = () => this._refreshBindingData();\n  this._refreshTopologyDataHandler = () => this._refreshTopologyData();\n  this._refreshAssetsHandler = () => this._refreshAssets();\n  this._addCreatedHandler = async (created) => {\n    const assets = await this._refreshAssets();\n    const asset = created ?? assets?.at(-1);\n    if (asset) this._openAsset(asset.id);\n  };\n  }\n''',
              '''    this._onboardingPreferenceIdentity = null;\n    this._hassByView = { home: null, add: null, advanced: null };\n    this._refreshBindingDataHandler = () => this._refreshBindingData();\n    this._refreshTopologyDataHandler = () => this._refreshTopologyData();\n    this._refreshAssetsHandler = () => this._refreshAssets();\n    this._addCreatedHandler = async (created) => {\n      const assets = await this._refreshAssets();\n      const asset = created ?? assets?.at(-1);\n      if (asset) this._openAsset(asset.id);\n    };\n  }\n''',
              1,
          )

          source = source.replace(
              '''  _hassFor(view) {\n  if (this._view === view || this._hassByView[view] == null) {\n    this._hassByView[view] = this.hass;\n  }\n  return this._hassByView[view];\n}\n_renderViews() {\n''',
              '''  _hassFor(view) {\n    if (this._view === view || this._hassByView[view] == null) {\n      this._hassByView[view] = this.hass;\n    }\n    return this._hassByView[view];\n  }\n  _renderViews() {\n''',
              1,
          )

          path.write_text(source)
          PY

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Commit formatted source
        run: |
          git rm .github/workflows/_tmp-format-passive.yml
          git add frontend/src/bindhome-panel.js custom_components/bindhome/panel/static/bindhome-panel.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format passive panel state isolation"
          git push origin HEAD:perf/passive-panel-rendering
