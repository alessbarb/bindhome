name: Temporary diagnostics completion

on:
  push:
    branches:
      - support/ha-diagnostics

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: support/ha-diagnostics
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Add diagnostics documentation and changelog
        run: python .github/scripts/_tmp_complete_diagnostics.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Normalize and verify Python
        run: |
          ruff check --fix custom_components/bindhome/diagnostics.py tests/test_diagnostics.py
          ruff format custom_components/bindhome/diagnostics.py tests/test_diagnostics.py
          ruff check custom_components/bindhome tests
          ruff format --check custom_components/bindhome tests
          pytest
      - name: Commit verified diagnostics and remove temporary files
        run: |
          rm -f .github/workflows/_tmp-diagnostics.yml .github/scripts/_tmp_complete_diagnostics.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: document privacy-preserving diagnostics'
          git push origin HEAD:support/ha-diagnostics
