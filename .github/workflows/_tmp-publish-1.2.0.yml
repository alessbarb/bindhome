name: Temporary Publish BindHome 1.2.0

on:
  push:
    branches:
      - release/1.2.0

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/1.2.0
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create clean release target commit
        run: |
          rm .github/workflows/_tmp-publish-1.2.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: finalize BindHome 1.2.0"
          git push origin HEAD:release/1.2.0
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify release metadata
        run: |
          python - <<'PY'
          import json, pathlib, re, tomllib
          root = pathlib.Path('.')
          versions = {
              tomllib.loads((root / 'pyproject.toml').read_text())['project']['version'],
              json.loads((root / 'custom_components/bindhome/manifest.json').read_text())['version'],
              json.loads((root / 'frontend/package.json').read_text())['version'],
              json.loads((root / 'frontend/package-lock.json').read_text())['version'],
              json.loads((root / 'frontend/package-lock.json').read_text())['packages']['']['version'],
          }
          if versions != {'1.2.0'}:
              raise SystemExit(f'Version metadata mismatch: {versions}')
          changelog = (root / 'CHANGELOG.md').read_text()
          if not re.search(r'^## \[1\.2\.0\] - 2026-09-05$', changelog, re.MULTILINE):
              raise SystemExit('Missing finalized 1.2.0 changelog section')
          release_section = changelog.split('## [1.2.0]', 1)[1].split('## [1.1.1]', 1)[0]
          if '#50' in release_section or '#29' in release_section:
              raise SystemExit('target:1.3 work leaked into 1.2.0')
          print('BindHome 1.2.0 release metadata verified')
          PY

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[dev]'

      - name: Pytest
        run: pytest

      - name: Ruff Lint & Format
        run: |
          ruff check .
          ruff format --check .

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          git diff --exit-code -- ../custom_components/bindhome/panel/static/bindhome-panel.js

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration

      - name: HA 2026.8.0 compatibility
        run: |
          python -m venv /tmp/bindhome-ha-2026-8
          source /tmp/bindhome-ha-2026-8/bin/activate
          python -m pip install --upgrade pip
          pip install .
          pip install "pytest-homeassistant-custom-component==0.13.354"
          python - <<'PY'
          import homeassistant.const
          assert homeassistant.const.__version__ == "2026.8.0", homeassistant.const.__version__
          PY
          pytest
          deactivate

      - name: HA 2026.9.0 compatibility
        run: |
          python -m venv /tmp/bindhome-ha-2026-9
          source /tmp/bindhome-ha-2026-9/bin/activate
          python -m pip install --upgrade pip
          pip install .
          pip install "pytest-homeassistant-custom-component==0.13.363"
          python - <<'PY'
          import homeassistant.const
          assert homeassistant.const.__version__ == "2026.9.0", homeassistant.const.__version__
          PY
          pytest
          deactivate

      - name: Extract release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          changelog = Path('CHANGELOG.md').read_text()
          section = changelog.split('## [1.2.0] - 2026-09-05', 1)[1]
          section = section.split('## [1.1.1]', 1)[0]
          section = section.rsplit('\n---\n', 1)[0].strip() + '\n'
          Path('/tmp/release-notes.md').write_text(section)
          PY

      - name: Publish BindHome 1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.2.0 already exists"
            exit 0
          fi
          gh release create v1.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "BindHome 1.2.0" \
            --notes-file /tmp/release-notes.md \
            --latest
