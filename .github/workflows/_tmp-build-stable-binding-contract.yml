name: Temporary Build Stable Binding Contract

on:
  push:
    branches:
      - architecture/stable-binding-contract

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: architecture/stable-binding-contract

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Commit generated bundle when changed
        run: |
          if git diff --quiet -- custom_components/bindhome/panel/static/bindhome-panel.js; then
            echo "Bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/bindhome/panel/static/bindhome-panel.js
          git commit -m "build(frontend): rebuild stable Binding identity panel"
          git push origin HEAD:architecture/stable-binding-contract
