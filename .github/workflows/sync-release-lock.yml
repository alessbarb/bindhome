name: Sync release lock metadata

on:
  push:
    branches:
      - p1/release-1.0-foundation

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1/release-1.0-foundation

      - name: Synchronize package-lock version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('custom_components/bindhome/panel/frontend/package-lock.json')
          data = json.loads(path.read_text())
          data['version'] = '1.0.0'
          data['packages']['']['version'] = '1.0.0'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit synchronized lock metadata
        run: |
          if git diff --quiet -- custom_components/bindhome/panel/frontend/package-lock.json; then
            echo 'package-lock.json already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/bindhome/panel/frontend/package-lock.json
          git commit -m 'release: synchronize frontend lock version'
          git push origin HEAD:p1/release-1.0-foundation
