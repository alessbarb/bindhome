name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-metadata:
    name: Release Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version metadata
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import tomllib

          root = pathlib.Path('.')
          pyproject = tomllib.loads((root / 'pyproject.toml').read_text())
          manifest = json.loads(
              (root / 'custom_components/bindhome/manifest.json').read_text()
          )
          frontend = root / 'custom_components/bindhome/panel/frontend'
          package = json.loads((frontend / 'package.json').read_text())
          package_lock = json.loads((frontend / 'package-lock.json').read_text())
          hacs = json.loads((root / 'hacs.json').read_text())

          versions = {
              'pyproject.toml': pyproject['project']['version'],
              'manifest.json': manifest['version'],
              'package.json': package['version'],
              'package-lock.json': package_lock['version'],
              'package-lock.json root package': package_lock['packages']['']['version'],
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f'Version metadata mismatch: {versions}')

          version = next(iter(versions.values()))
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'Version is not SemVer-compatible: {version}')

          minimum_ha = hacs.get('homeassistant')
          if not isinstance(minimum_ha, str) or not re.fullmatch(
              r'\d{4}\.\d+\.\d+', minimum_ha
          ):
              raise SystemExit(
                  f'Invalid HACS Home Assistant minimum: {minimum_ha!r}'
              )

          print(f'BindHome version: {version}')
          print(f'Minimum Home Assistant: {minimum_ha}')
          PY

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run pytest
        run: pytest

  ruff:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff Check
        run: ruff check .

      - name: Ruff Format Check
        run: ruff format --check .

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom_components/bindhome/panel/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: custom_components/bindhome/panel/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify committed bundle is current
        run: git diff --exit-code -- ../static/bindhome-panel.js
