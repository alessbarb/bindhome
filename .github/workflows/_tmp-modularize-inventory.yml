name: Temporary Modularize Inventory Workflows

on:
  push:
    branches:
      - frontend/modularize-inventory-workflows

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: frontend/modularize-inventory-workflows

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wire extracted modules
        run: |
          python - <<'PY'
          from pathlib import Path

          asset_path = Path("frontend/src/inventory/asset-detail-editor.js")
          text = asset_path.read_text()
          old_imports = '''import { indexBindingStatuses } from "../bindings/binding-state.js";
          import "../bindings/primary-connection-editor.js";
          import "../topology/asset-topology.js";
          '''
          if old_imports not in text:
              raise SystemExit("asset-detail import marker not found")
          text = text.replace(old_imports, 'import "./asset-connections.js";\n', 1)

          start = text.index("  _assetName(assetId) {")
          end = text.index("  _renderAreaOptions() {", start)
          text = text[:start] + text[end:]

          start = text.index("  _renderConnections() {")
          end = text.index("  render() {", start)
          replacement = '''  _renderConnections() {
            return html`
              <bindhome-asset-connections
                .hass=${this.hass}
                .t=${this.t}
                .asset=${this.asset}
                .assets=${this.assets}
                .areas=${this.areas}
                .registry=${this.registry}
                .bindingStatuses=${this.bindingStatuses}
                .entityRegistry=${this.entityRegistry}
                .deviceRegistry=${this.deviceRegistry}
                .refreshBindingData=${this.refreshBindingData}
                .refreshTopologyData=${this.refreshTopologyData}
                @topology-sync-warning=${(event) => { this._error = event.detail; }}
              ></bindhome-asset-connections>
            `;
          }

          '''
          text = text[:start] + replacement + text[end:]
          asset_path.write_text(text)

          browser_path = Path("frontend/src/inventory/inventory-browser.js")
          text = browser_path.read_text()
          old_imports = '''import { buildInventoryHierarchy } from "./inventory-browser-state.js";

          import "./asset-detail-editor.js";

          const NO_AREA_KEY = "__bindhome_no_area_assets__";
          const UNKNOWN_AREA_KEY = "__bindhome_unknown_area_assets__";
          '''
          new_imports = '''import { buildInventoryHierarchy } from "./inventory-browser-state.js";
          import {
            NO_AREA_KEY,
            UNKNOWN_AREA_KEY,
            locationKeyForAsset,
            replaceInventoryAsset,
            targetForInventoryKey,
          } from "./inventory-browser-selection.js";

          import "./asset-detail-editor.js";
          '''
          if old_imports not in text:
              raise SystemExit("inventory-browser import marker not found")
          text = text.replace(old_imports, new_imports, 1)

          start = text.index("  _allAreaNodes(")
          end = text.index("  willUpdate(changed) {", start)
          selection_bridge = '''  _targetForKey(key, hierarchy = this._hierarchy) {
            return targetForInventoryKey(key, hierarchy, this.t);
          }

          '''
          text = text[:start] + selection_bridge + text[end:]

          start = text.index("  _locationKeyForAsset(asset) {")
          end = text.index("  _handleEditingChanged(event) {", start)
          location_bridge = '''  _locationKeyForAsset(asset) {
            return locationKeyForAsset(asset, this.areas);
          }

          '''
          text = text[:start] + location_bridge + text[end:]

          start = text.index("    const nextAssets =", text.index("  _handleAssetUpdated(event) {"))
          end = text.index("    this.assets = nextAssets;", start)
          replacement = '''    const nextAssets = replaceInventoryAsset(
              this.assets,
              updated,
            );

          '''
          text = text[:start] + replacement + text[end:]
          browser_path.write_text(text)

          test_path = Path("frontend/test/asset-editor.test.js")
          text = test_path.read_text()
          test_start = text.index(
              '    const text =\n      editor.shadowRoot.textContent +',
              text.index('"Connections show Relations, friendly HA entity and Representation"'),
          )
          test_end = text.index(
              "    assert.doesNotMatch(text, /Other bindings/);",
              test_start,
          )
          replacement = '''    const connections = editor.shadowRoot.querySelector(
              "bindhome-asset-connections",
            );
            assert.ok(connections);
            await settle(connections);

            const text =
              editor.shadowRoot.textContent +
              connections.shadowRoot.textContent +
              [...connections.shadowRoot.querySelectorAll(
                "bindhome-primary-connection-editor",
              )]
                .map((child) => child.shadowRoot?.textContent ?? "")
                .join("\\n");

            const topology = connections.shadowRoot.querySelector(
              "bindhome-asset-topology",
            );
            const topologyText = topology?.shadowRoot?.textContent ?? "";

            assert.equal(
              connections.shadowRoot.querySelectorAll(
                "bindhome-primary-connection-editor",
              ).length,
              2,
            );
          '''
          text = text[:test_start] + replacement + text[test_end:]
          test_path.write_text(text)
          PY

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Commit wired source and generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/inventory/asset-detail-editor.js \
            frontend/src/inventory/inventory-browser.js \
            frontend/test/asset-editor.test.js \
            custom_components/bindhome/panel/static/bindhome-panel.js
          if git diff --cached --quiet; then
            echo "No wiring changes"
            exit 0
          fi
          git commit -m "refactor: wire modular inventory boundaries"
          git push origin HEAD:frontend/modularize-inventory-workflows
