name: Fix PR 131

on:
  push:
    branches:
      - feat/managed-hardware-visibility

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/managed-hardware-visibility
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install ruff
      - name: Apply targeted fixes
        run: python .github/scripts/fix_pr131.py
      - name: Format Python
        run: |
          ruff check . --fix --exit-zero
          ruff format .
          ruff check .
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-pr131.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align visibility schema tests and formatting"
          git push origin HEAD:feat/managed-hardware-visibility
