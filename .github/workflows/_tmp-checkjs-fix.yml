name: Temporary checkJs fixes

on:
  push:
    branches:
      - dx/frontend-checkjs

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'fix: type frontend contracts for checkJs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dx/frontend-checkjs
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply narrow typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('frontend/src')
          marker = '    this.t = (key) => key;'
          replacement = "    /** @type {import('../types.js').Localizer} */\n    this.t = (key) => key;"
          for path in root.rglob('*.js'):
              text = path.read_text()
              if marker in text and "@type {import('../types.js').Localizer}" not in text:
                  text = text.replace(marker, replacement, 1)
                  path.write_text(text)

          workflow = root / 'inventory' / 'inventory-workflow.js'
          text = workflow.read_text()
          if '    this.hass = null;' not in text:
              text = text.replace('    super();\n    this.presets = [];', '    super();\n    this.hass = null;\n    this.presets = [];', 1)
          text = text.replace(
              '          field?.focus({ preventScroll: true });',
              '          if (field instanceof HTMLElement) field.focus({ preventScroll: true });',
              1,
          )
          workflow.write_text(text)
          PY
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Remove temporary workflow and commit verified fixes
        run: |
          rm .github/workflows/_tmp-checkjs-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend custom_components/bindhome/panel/static/bindhome-panel.js .github/workflows/_tmp-checkjs-fix.yml
          git diff --cached --check
          git commit -m 'fix: type frontend contracts for checkJs'
          git push origin HEAD:dx/frontend-checkjs
