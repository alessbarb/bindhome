name: Temporary Verify Idempotent Elements

on:
  push:
    branches:
      - fix/idempotent-custom-elements

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/idempotent-custom-elements
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply systematic registration migration
        run: python .github/_tmp_idempotent_elements.py
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Execute generated bundle twice in one CustomElementRegistry
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import { Window } from "happy-dom";

          const window = new Window({ url: "http://localhost/bindhome" });
          Object.assign(globalThis, {
            window,
            document: window.document,
            customElements: window.customElements,
            HTMLElement: window.HTMLElement,
            ShadowRoot: window.ShadowRoot,
            Document: window.Document,
            CSSStyleSheet: window.CSSStyleSheet,
            Event: window.Event,
            CustomEvent: window.CustomEvent,
            CSS: window.CSS,
          });

          const bundle = new URL(
            "../custom_components/bindhome/panel/static/bindhome-panel.js",
            import.meta.url,
          );
          await import(`${bundle.href}?evaluation=1`);
          const first = customElements.get("bindhome-primary-connection-editor");
          if (!first) throw new Error("primary connection editor was not registered");

          await import(`${bundle.href}?evaluation=2`);
          const second = customElements.get("bindhome-primary-connection-editor");
          if (second !== first) {
            throw new Error("second bundle evaluation replaced the first constructor");
          }
          NODE
      - name: Commit verified result and remove temporary tooling
        run: |
          rm .github/_tmp_idempotent_elements.py .github/workflows/_tmp-idempotent-elements.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make BindHome custom-element registration idempotent"
          git push origin HEAD:fix/idempotent-custom-elements
