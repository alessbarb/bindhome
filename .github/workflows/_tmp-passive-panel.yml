name: Temporary passive panel rendering patch

on:
  push:
    branches:
      - perf/passive-panel-rendering

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/passive-panel-rendering
          fetch-depth: 0

      - name: Stop routine hass updates at inactive views
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/bindhome-panel.js")
          source = path.read_text()

          constructor_anchor = "    this._onboardingPreferenceIdentity = null;\n"
          constructor_insert = """    this._onboardingPreferenceIdentity = null;
            this._hassByView = { home: null, add: null, advanced: null };
            this._refreshBindingDataHandler = () => this._refreshBindingData();
            this._refreshTopologyDataHandler = () => this._refreshTopologyData();
            this._refreshAssetsHandler = () => this._refreshAssets();
            this._addCreatedHandler = async (created) => {
              const assets = await this._refreshAssets();
              const asset = created ?? assets?.at(-1);
              if (asset) this._openAsset(asset.id);
            };
          """
          if constructor_anchor not in source:
              raise SystemExit("constructor anchor not found")
          source = source.replace(constructor_anchor, constructor_insert, 1)

          render_anchor = "  _renderViews() {\n"
          helper = """  _hassFor(view) {
            if (this._view === view || this._hassByView[view] == null) {
              this._hassByView[view] = this.hass;
            }
            return this._hassByView[view];
          }
          _renderViews() {
          """
          if render_anchor not in source:
              raise SystemExit("render anchor not found")
          source = source.replace(render_anchor, helper, 1)

          replacements = {
              "      hass: this.hass,\n": "",
              "      refreshBindingData: () => this._refreshBindingData(),\n": "      refreshBindingData: this._refreshBindingDataHandler,\n",
              "      refreshTopologyData: () => this._refreshTopologyData(),\n": "      refreshTopologyData: this._refreshTopologyDataHandler,\n",
              "          .hass=${common.hass}\n": "          .hass=${this._hassFor(\"home\")}\n",
              "          .refreshAssets=${() => this._refreshAssets()}\n": "          .refreshAssets=${this._refreshAssetsHandler}\n",
              "          .hass=${this.hass}\n": "          .hass=${this._hassFor(\"add\")}\n",
              "          .onCreated=${async (created) => {\n            const assets = await this._refreshAssets();\n            const asset = created ?? assets?.at(-1);\n            if (asset) this._openAsset(asset.id);\n          }}\n": "          .onCreated=${this._addCreatedHandler}\n",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"source anchor not found: {old!r}")
              source = source.replace(old, new, 1)

          # The second common.hass occurrence belongs to Advanced.
          old = "          .hass=${common.hass}\n"
          if old not in source:
              raise SystemExit("advanced hass anchor not found")
          source = source.replace(old, "          .hass=${this._hassFor(\"advanced\")}\n", 1)

          path.write_text(source)
          PY

      - name: Add regression coverage for passive hass propagation
        run: |
          cat > frontend/test/passive-panel.test.js <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { Window } from "happy-dom";

          const window = new Window({ url: "http://localhost/bindhome" });
          Object.assign(globalThis, {
            window,
            document: window.document,
            customElements: window.customElements,
            HTMLElement: window.HTMLElement,
            ShadowRoot: window.ShadowRoot,
            Document: window.Document,
            CSSStyleSheet: window.CSSStyleSheet,
            Event: window.Event,
            CustomEvent: window.CustomEvent,
            CSS: window.CSS,
          });

          if (!customElements.get("ha-icon")) {
            customElements.define("ha-icon", class extends HTMLElement {});
          }
          if (!customElements.get("ha-switch")) {
            customElements.define("ha-switch", class extends HTMLElement {});
          }

          await import("../src/bindhome-panel.js");

          async function settle(element) {
            await element.updateComplete;
            await window.happyDOM.waitUntilComplete();
            await element.updateComplete;
          }

          function countRequests(element) {
            let count = 0;
            const original = element.requestUpdate.bind(element);
            element.requestUpdate = (...args) => {
              count += 1;
              return original(...args);
            };
            return {
              get count() {
                return count;
              },
              reset() {
                count = 0;
              },
            };
          }

          function fixture() {
            const panel = document.createElement("bindhome-panel");
            panel._loading = false;
            panel._initialized = true;
            panel._translationLanguage = "en";
            panel._t = (key) => key;
            panel._floors = [];
            panel._areas = [];
            panel._assets = [];
            panel._registry = { assets: [], relations: [], bindings: [], representations: [] };
            panel.hass = { language: "en", states: {}, callWS: async () => ({}) };
            document.body.append(panel);
            return panel;
          }

          test("routine hass updates propagate only into the active top-level view", async () => {
            const panel = fixture();
            await settle(panel);

            const home = panel.shadowRoot.querySelector("bindhome-home-view");
            const add = panel.shadowRoot.querySelector("bindhome-add-view");
            const advanced = panel.shadowRoot.querySelector("bindhome-advanced-view");
            assert.ok(home);
            assert.ok(add);
            assert.ok(advanced);

            const homeRequests = countRequests(home);
            const addRequests = countRequests(add);
            const advancedRequests = countRequests(advanced);

            panel.hass = {
              language: "en",
              states: { "sensor.example": { state: "one" } },
              callWS: async () => ({}),
            };
            await settle(panel);

            assert.ok(homeRequests.count > 0);
            assert.equal(addRequests.count, 0);
            assert.equal(advancedRequests.count, 0);

            panel._setAdvancedPinned(true);
            panel._navigate("advanced");
            await settle(panel);
            homeRequests.reset();
            addRequests.reset();
            advancedRequests.reset();

            panel.hass = {
              language: "en",
              states: { "sensor.example": { state: "two" } },
              callWS: async () => ({}),
            };
            await settle(panel);

            assert.equal(homeRequests.count, 0);
            assert.equal(addRequests.count, 0);
            assert.ok(advancedRequests.count > 0);
          });
          EOF

      - name: Document passive panel behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          source = path.read_text()
          anchor = "### Reliability\n\n"
          entry = (
              "- The BindHome panel now keeps Home Assistant's high-frequency `hass` updates local to the active top-level view. "
              "Inactive Home, Add and Advanced views retain their mounted UI state without receiving routine state-machine churn, "
              "reducing unnecessary frontend work while preserving drafts and navigation state.\n"
          )
          if anchor not in source:
              raise SystemExit("CHANGELOG Reliability anchor not found")
          source = source.replace(anchor, anchor + entry, 1)
          path.write_text(source)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Commit source, regression test and generated bundle
        run: |
          git rm .github/workflows/_tmp-passive-panel.yml
          git add CHANGELOG.md frontend/src/bindhome-panel.js frontend/test/passive-panel.test.js custom_components/bindhome/panel/static/bindhome-panel.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf: isolate inactive views from hass churn"
          git push origin HEAD:perf/passive-panel-rendering
