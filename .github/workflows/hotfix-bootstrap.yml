name: Hotfix Bootstrap

on:
  push:
    branches:
      - hotfix/release-zip-1.4.2

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/release-zip-1.4.2

      - name: Synchronize npm release metadata
        working-directory: frontend
        run: npm version 1.4.2 --no-git-tag-version --allow-same-version

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/hotfix-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json .github/workflows/hotfix-bootstrap.yml
          git diff --cached --exit-code && exit 0
          git commit -m "release: synchronize frontend lock metadata for 1.4.2"
          git push origin HEAD:hotfix/release-zip-1.4.2
