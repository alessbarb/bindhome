name: Temporary Reconcile Registry 1.3

on:
  push:
    branches:
      - reliability/live-registry-concurrency-main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reliability/live-registry-concurrency-main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reapply validated Registry concurrency changes
        run: |
          git fetch origin reliability/live-registry-concurrency-v2
          git checkout origin/reliability/live-registry-concurrency-v2 -- \
            custom_components/bindhome/backup.py \
            custom_components/bindhome/backup_websocket.py \
            custom_components/bindhome/deletion.py \
            custom_components/bindhome/deletion_websocket.py \
            custom_components/bindhome/manager.py \
            custom_components/bindhome/translations/en.json \
            custom_components/bindhome/translations/es.json \
            custom_components/bindhome/websocket.py \
            frontend/src/api/bindhome-api.js \
            frontend/src/bindhome-panel.js \
            frontend/test/registry-concurrency.test.js \
            frontend/test/registry-live-panel.test.js \
            tests/test_registry_live_websocket.py \
            tests/test_registry_revision.py \
            tests/test_websocket.py
          python -c 'from pathlib import Path; p=Path("frontend/src/bindhome-panel.js"); s=p.read_text(); marker="// Typed contracts live in types.d.ts; shell race behavior is covered by regression tests.\n"; imp="import { defineBindHomeElement } from \"./custom-elements.js\";\n"; assert marker in s and "customElements.define(\"bindhome-panel\", BindHomePanel);" in s; s=s.replace(marker, imp+marker, 1).replace("customElements.define(\"bindhome-panel\", BindHomePanel);", "defineBindHomeElement(\"bindhome-panel\", BindHomePanel);", 1); p.write_text(s)'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Verify Python
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests
          pytest -q
      - name: Verify frontend and rebuild bundle
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit reconciled result and remove temporary workflow
        run: |
          rm .github/workflows/_tmp-reconcile-registry-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: reconcile live Registry concurrency with idempotent panel loading"
          git push origin HEAD:reliability/live-registry-concurrency-main
