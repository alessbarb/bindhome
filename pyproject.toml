[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bindhome"
version = "1.3.0"
description = "Stable home infrastructure bound to replaceable Home Assistant hardware"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Alessandro Barbagallo" }
]

[project.urls]
Homepage = "https://github.com/alessbarb/bindhome"
Issues = "https://github.com/alessbarb/bindhome/issues"
Changelog = "https://github.com/alessbarb/bindhome/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-homeassistant-custom-component==0.13.363",
  "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components.bindhome*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.bindhome" = [
  "manifest.json",
  "services.yaml",
  "translations/*.json",
  "brand/*.png",
  "panel/static/*.js",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
